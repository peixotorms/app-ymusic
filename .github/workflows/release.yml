# Personal releases: Android, Windows, and Linux.
name: release
'on':
  push:
    tags:
    - release-*
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  FFMPEG_BUILD_REPO: ymusic-io/ffmpeg-build
  FFMPEG_BUILD_REF: d0a89492c442dbca24dfabd044b866299f0a97b1
  NDK_VERSION: 28.2.13676358
jobs:
  release-tag:
    runs-on: ubuntu-24.04
    steps:
    - name: Require a release tag
      run: |
        case "$GITHUB_REF" in refs/tags/release-v*) ;; *) echo "Choose a release-v tag"; exit 1 ;; esac
  ffmpeg:
    name: ffmpeg ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: android-armeabi-v7a
          runner: ubuntu-24.04
        - slug: android-arm64-v8a
          runner: ubuntu-24.04
        - slug: android-x86
          runner: ubuntu-24.04
        - slug: android-x86_64
          runner: ubuntu-24.04
        - slug: linux-x86_64
          runner: ubuntu-24.04
        - slug: linux-arm64
          runner: ubuntu-24.04-arm
        - slug: windows-x86_64
          runner: windows-2022
          msystem: MINGW64
          cc: gcc
          packages: mingw-w64-x86_64-toolchain mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf mingw-w64-x86_64-meson mingw-w64-x86_64-ninja mingw-w64-x86_64-zlib
        - slug: windows-arm64
          runner: windows-11-arm
          msystem: CLANGARM64
          cc: clang
          packages: mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-pkgconf mingw-w64-clang-aarch64-meson mingw-w64-clang-aarch64-ninja mingw-w64-clang-aarch64-zlib
    steps:
    - if: startsWith(matrix.slug, 'windows-')
      run: git config --global core.autocrlf false
    - id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ffmpeg-build/out/${{ matrix.slug }}
        key: ffmpeg-${{ matrix.slug }}-${{ env.FFMPEG_BUILD_REF }}${{ startsWith(matrix.slug, 'android-') && format('-ndk{0}', env.NDK_VERSION) || '' }}
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ${{ env.FFMPEG_BUILD_REPO }}
        ref: ${{ env.FFMPEG_BUILD_REF }}
        path: ffmpeg-build
        submodules: recursive
        fetch-depth: 1
    - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.slug, 'android-')
      name: Install NDK
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
    - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.slug, 'android-')
      working-directory: ffmpeg-build
      run: |
        sudo apt-get update && sudo apt-get install -y nasm automake autoconf libtool pkg-config patchelf
        scripts/build-android.sh "${SLUG#android-}" || {
          # A dependency's configure failure prints only its verdict; the reason is in its log.
          for log in .deps-$SLUG/.build/*/config.log; do
            [ -f "$log" ] && { echo "::group::$log"; tail -n 80 "$log"; echo "::endgroup::"; }
          done
          exit 1
        }
      env:
        SLUG: ${{ matrix.slug }}
    - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.slug, 'linux-')
      working-directory: ffmpeg-build
      run: |
        sudo apt-get update && sudo apt-get install -y nasm automake autoconf libtool pkg-config meson ninja-build patchelf
        scripts/build-desktop.sh || {
          for log in .deps/.build/*/config.log; do
            [ -f "$log" ] && { echo "::group::$log"; tail -n 80 "$log"; echo "::endgroup::"; }
          done
          exit 1
        }
    - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.slug, 'windows-')
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: git make diffutils autoconf automake libtool patch ${{ matrix.packages }}
    - if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.slug, 'windows-')
      shell: msys2 {0}
      working-directory: ffmpeg-build
      env:
        HOST_CC: ${{ matrix.cc }}
      run: |
        scripts/build-desktop.sh || {
          for log in .deps/.build/*/config.log; do
            [ -f "$log" ] && { echo "::group::$log"; tail -n 80 "$log"; echo "::endgroup::"; }
          done
          exit 1
        }
    needs: release-tag
  android:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: YMusicV4
    - name: Restore ffmpeg android-armeabi-v7a
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ffmpeg-build/out/android-armeabi-v7a
        key: ffmpeg-android-armeabi-v7a-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
        fail-on-cache-miss: true
    - name: Restore ffmpeg android-arm64-v8a
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ffmpeg-build/out/android-arm64-v8a
        key: ffmpeg-android-arm64-v8a-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
        fail-on-cache-miss: true
    - name: Restore ffmpeg android-x86
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ffmpeg-build/out/android-x86
        key: ffmpeg-android-x86-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
        fail-on-cache-miss: true
    - name: Restore ffmpeg android-x86_64
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ffmpeg-build/out/android-x86_64
        key: ffmpeg-android-x86_64-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
        fail-on-cache-miss: true
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: 21
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
    - name: Install NDK
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
    - name: Restore personal Android signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        test -n "$KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 is required'; exit 1; }
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ymusic-release.p12"
        chmod 600 "$RUNNER_TEMP/ymusic-release.p12"
    - name: Assemble release APKs
      working-directory: YMusicV4
      run: ./gradlew -Pproduction=true :androidApp:assembleRelease :engine-js:closureJs :engine-js:closurePlayerJs spotlessCheck
      env:
        YMUSIC_ANDROID_STORE_FILE: ${{ runner.temp }}/ymusic-release.p12
        YMUSIC_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        YMUSIC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        YMUSIC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    - name: Discard signing key
      if: always()
      run: rm -f "$RUNNER_TEMP/ymusic-release.p12"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: android-apks
        path: YMusicV4/androidApp/build/outputs/apk/release/*.apk
        if-no-files-found: error
    - name: Name the JS bundles by version
      working-directory: YMusicV4
      run: |
        set -euo pipefail
        version() {
          v="$(sed -n "s/.*const val $1 = \([0-9][0-9]*\)L.*/\1/p" buildSrc/src/main/kotlin/Dependencies.kt)"
          [ -n "$v" ] || { echo "$1 not found in buildSrc Dependencies.kt" >&2; exit 1; }
          echo "$v"
        }
        engine="$(version engineJsVersion)"
        player="$(version playerJsVersion)"
        mkdir -p "$RUNNER_TEMP/js-bundles"
        cp engine-js/build/dist/engine.js "$RUNNER_TEMP/js-bundles/engine.$engine.js"
        cp engine-js/build/dist/player.js "$RUNNER_TEMP/js-bundles/player.$player.js"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: js-bundles
        path: ${{ runner.temp }}/js-bundles/*.js
        if-no-files-found: error
  windows:
    name: windows ${{ matrix.slug }}
    needs: ffmpeg
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: windows-x86_64
          runner: windows-2022
          msystem: MINGW64
          prefix: mingw64
          packages: mingw-w64-x86_64-toolchain mingw-w64-x86_64-make
        - slug: windows-arm64
          runner: windows-11-arm
          msystem: CLANGARM64
          prefix: clangarm64
          packages: mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-make
    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: YMusicV4
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ffmpeg-build/out/${{ matrix.slug }}
        key: ffmpeg-${{ matrix.slug }}-${{ env.FFMPEG_BUILD_REF }}
        fail-on-cache-miss: true
    - id: msys2
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
      with:
        msystem: ${{ matrix.msystem }}
        install: ${{ matrix.packages }}
    - name: Locate MinGW
      shell: bash
      run: echo "MINGW_HOME=$(cygpath -m '${{ steps.msys2.outputs.msys2-location }}')/${{ matrix.prefix }}" >> "$GITHUB_ENV"
    - name: Install Inno Setup
      shell: bash
      env:
        INNO_SETUP_VERSION: 6.7.1
      run: |
        set -euo pipefail
        find_iscc() {
          ls "/c/Program Files (x86)/Inno Setup "*/ISCC.exe "/c/Program Files/Inno Setup "*/ISCC.exe \
            "$(cygpath -u "$LOCALAPPDATA")/Programs/Inno Setup "*/ISCC.exe 2>/dev/null | head -n 1 || true
        }
        iscc="$(find_iscc)"
        [ -n "$iscc" ] || { choco install innosetup --version "$INNO_SETUP_VERSION" -y --no-progress; iscc="$(find_iscc)"; }
        [ -n "$iscc" ] || { echo "ISCC.exe not found after installing Inno Setup" >&2; exit 1; }
        echo "using $iscc"
        echo "INNO_ISCC=$(cygpath -w "$iscc")" >> "$GITHUB_ENV"
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: 21
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
    - name: Package the installer
      shell: bash
      working-directory: YMusicV4
      run: PATH="$(cygpath -u "$MINGW_HOME")/bin:$PATH" ./gradlew -Pproduction=true "-Pinno.iscc=$INNO_ISCC" :desktopApp:packageReleaseInnoSetup
    - name: Upload packaging logs
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ matrix.slug }}-compose-logs
        path: YMusicV4/desktopApp/build/compose/logs/
        if-no-files-found: ignore
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ matrix.slug }}-setup
        path: YMusicV4/desktopApp/build/compose/binaries/main-release/innosetup/*.exe
        if-no-files-found: error
  linux:
    name: linux ${{ matrix.slug }}
    needs: ffmpeg
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: linux-x86_64
          runner: ubuntu-24.04
        - slug: linux-arm64
          runner: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: YMusicV4
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ffmpeg-build/out/${{ matrix.slug }}
        key: ffmpeg-${{ matrix.slug }}-${{ env.FFMPEG_BUILD_REF }}
        fail-on-cache-miss: true
    - run: sudo apt-get update && sudo apt-get install -y libpulse-dev fakeroot
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: 21
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
    - name: Package the .deb
      working-directory: YMusicV4
      run: ./gradlew -Pproduction=true :desktopApp:packageReleaseDeb
    - name: Upload packaging logs
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ matrix.slug }}-compose-logs
        path: YMusicV4/desktopApp/build/compose/logs/
        if-no-files-found: ignore
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ matrix.slug }}-deb
        path: YMusicV4/desktopApp/build/compose/binaries/main-release/deb/*.deb
        if-no-files-found: error
  test:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    steps:
    - run: sudo apt-get update && sudo apt-get install -y libpulse-dev xvfb
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: YMusicV4
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ffmpeg-build/out/linux-x86_64
        key: ffmpeg-linux-x86_64-${{ env.FFMPEG_BUILD_REF }}
        fail-on-cache-miss: true
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: 21
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
    - working-directory: YMusicV4
      run: xvfb-run -a ./gradlew --continue -Pci=true :commonUi:jvmTest :desktopApp:jvmTest :download:jvmTest :dynamic-engine:jvmTest :image-loader:jvmTest :kmpCommon:jvmTest
        :kmpFfmpeg:jvmTest :kmpHttp:core:jvmTest :kmpHttp:json:jvmTest :media-scanner:jvmTest :media-store:jvmTest :player:jvmTest :projectCommon:jvmTest :quickjs:jvmTest
        :remote-config:jvmTest :settings:jvmTest :telemetry:jvmTest :yt-media:jvmTest
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-reports
        path: YMusicV4/**/build/reports/tests/
        if-no-files-found: ignore
  compat-bundles:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: 21
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
    - run: ./gradlew -Pproduction=true :engine-js:closureJs :engine-js:closurePlayerJs
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: bundles
        path: |
          engine-js/build/dist/engine.js
          engine-js/build/dist/player.js
        if-no-files-found: error
    - id: tags
      run: echo "tags=$(compat/tags.sh --json)" >> "$GITHUB_OUTPUT"
    needs: release-tag
  compat:
    needs: compat-bundles
    if: needs.compat-bundles.outputs.tags != '[]'
    name: compat ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.compat-bundles.outputs.tags) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: head
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.tag }}
        path: host
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: bundles
        path: bundles
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: 21
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
    - run: head/compat/overlay.sh host bundles
    - working-directory: host
      run: ./gradlew :dynamic-engine:jvmTest --tests 'io.ymusic.dynamicengine.compat.*' --rerun
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: report-${{ matrix.tag }}
        path: host/dynamic-engine/build/reports/tests/jvmTest
  release:
    needs:
    - android
    - windows
    - linux
    - test
    - compat
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: YMusicV4
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        path: artifacts
    - name: Collect the files
      run: |
        set -euo pipefail
        mkdir -p release
        version="$(sed -n 's/^ymusic\.versionName=//p' YMusicV4/gradle.properties | tr -d '[:space:]')"
        [ -n "$version" ] || { echo "ymusic.versionName not found" >&2; exit 1; }
        one() { set -- $1; [ $# -eq 1 ] && [ -f "$1" ] || { echo "expected one file for: $*" >&2; exit 1; }; echo "$1"; }
        cp "$(one 'artifacts/android-apks/*-armeabi-v7a-release.apk')" "release/YMusic-$version-android-armv7.apk"
        cp "$(one 'artifacts/android-apks/*-arm64-v8a-release.apk')" "release/YMusic-$version-android-arm64.apk"
        cp "$(one 'artifacts/android-apks/*-x86-release.apk')" "release/YMusic-$version-android-x86.apk"
        cp "$(one 'artifacts/android-apks/*-x86_64-release.apk')" "release/YMusic-$version-android-x86_64.apk"
        cp "$(one 'artifacts/windows-x86_64-setup/*.exe')" "release/YMusic-$version-windows-x64-setup.exe"
        cp "$(one 'artifacts/windows-arm64-setup/*.exe')" "release/YMusic-$version-windows-arm64-setup.exe"
        cp "$(one 'artifacts/linux-x86_64-deb/*.deb')" "release/YMusic-$version-linux-x86_64.deb"
        cp "$(one 'artifacts/linux-arm64-deb/*.deb')" "release/YMusic-$version-linux-arm64.deb"
        cp "$(one 'artifacts/js-bundles/engine.*.js')" "$(one 'artifacts/js-bundles/player.*.js')" release/
        (cd release && sha256sum * > SHA256SUMS)
        ls -l release
    - name: Build the release notes
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        notes="$RUNNER_TEMP/release-notes.md"
        gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -q .body > "$notes"
        version="${TAG#*-v}"
        section="$(awk -v head="## $version" '$0 == head { found = 1 } found && /^## / && $0 != head { exit } found' YMusicV4/CHANGELOG.md)"
        if [ -z "$section" ]; then
          echo "::warning::CHANGELOG.md has no '## $version' section; the release notes carry only the compare link"
        else
          printf '\n%s\n' "$section" >> "$notes"
        fi
        cat "$notes" >> "$GITHUB_STEP_SUMMARY"
    - name: Create the draft release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        notes="$RUNNER_TEMP/release-notes.md"
        draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || true)"
        case "$draft" in
          "")    gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --draft \
                   --title "$TAG" --notes-file "$notes" ;;
          # A re-run of the tag refreshes its draft's files and notes.
          true)  gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
                 gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes" ;;
          *)     echo "release $TAG is already published; not touching it" >&2; exit 1 ;;
        esac
    if: ${{ always() && needs.android.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.test.result == 'success'
      && (needs.compat.result == 'success' || needs.compat.result == 'skipped') }}
